## Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

## Power
CONFIG_ZMK_SLEEP=y
CONFIG_PM_DEVICE=y
CONFIG_ZMK_EXT_POWER=y

## Battery reporting (safe globally)
CONFIG_ZMK_BATTERY_REPORTING=y

## Pointing / input
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

## Queue
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

## Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN=ZMK_DISPLAY_STATUS_SCREEN_CUSTOM

## nice_oled / nice_epaper compatibility
CONFIG_NICE_OLED_ON=y
CONFIG_NICE_EPAPER_ON=y

## IMPORTANT: enables the nice_oled status widget + needed LVGL features
CONFIG_NICE_OLED_WIDGET_STATUS=y

## Make output look like simple icons (no “tab” background)
CONFIG_NICE_OLED_WIDGET_OUTPUT_BACKGROUND=n

## Battery widget behavior (Experimental)
## Show 1 peripheral battery + central battery on the central screen
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_AND_CENTRAL=y

## Widget positions
## Battery (top-left) — icon style is handled by the widget, тут лише позиція
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=0

## Output icons (top-right) — use ePaper defaults (work reliably)
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=45
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=2
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=49
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_X=44
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_Y=0

## Display perf (для анімацій)
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
