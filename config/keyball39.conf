## Bluetooth & Power (спільне)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_BATTERY_REPORTING=y

## Pointing / input
CONFIG_ZMK_POINTING=y

## Display Base (вмикаємо саму підтримку екранів)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_ON=y
CONFIG_NICE_EPAPER_ON=y
CONFIG_NICE_OLED_WIDGET_STATUS=y

## Memory (важливо для графіки)
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
