## Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

## Power
CONFIG_ZMK_SLEEP=y
CONFIG_PM_DEVICE=y
CONFIG_ZMK_EXT_POWER=y

## Battery reporting (safe globally)
CONFIG_ZMK_BATTERY_REPORTING=y

## Pointing / input
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

## Queue
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

## Display (DISABLED for diagnostic — see commit msg; revert after test)
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

## nice!oled disabled — display now rendered by nice-view-press-start
CONFIG_NICE_OLED_ON=n
CONFIG_NICE_EPAPER_ON=n

## Enables the nice_oled status widget + needed LVGL features
CONFIG_NICE_OLED_WIDGET_STATUS=y

## Важливо: прибирає “плашки/фон”, робить вигляд “чисті іконки”
CONFIG_NICE_OLED_WIDGET_OUTPUT_BACKGROUND=n

## Modifiers: тільки іконки (без букв)
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_LETTER=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_BOX=y

## Якщо хочеш саме Windows-стиль (Win/Alt як на вінді) – увімкни це:
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

## HID indicators (іконки капса і т.д.)
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y

## Positions (ePaper defaults from docs)
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=26
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=19

CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=45
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=2
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=49
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_X=44
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_Y=0

## Display perf (для анімацій/графіків)
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
