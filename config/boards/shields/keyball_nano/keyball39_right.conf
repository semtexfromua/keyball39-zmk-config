# --- CENTRAL WPM + LUNA ---
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=300    # default from docs :contentReference[oaicite:13]{index=13}

# (опційно) якщо хочеш, щоб Луна реагувала на CapsLock — увімкни:
# CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=y
# CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA_ONLY_CAPSLOCK=y
# CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA_ANIMATION_MS=300  :contentReference[oaicite:14]{index=14}

# --- TRACKBALL (ONLY where sensor exists) ---
CONFIG_SPI=y
CONFIG_PMW3610_ALT=y
