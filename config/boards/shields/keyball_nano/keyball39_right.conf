## Central-only split features (тільки на центральній половинці)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

## Trackball sensor (якщо фізично на правій)
CONFIG_SPI=y
CONFIG_PMW3610_ALT=y
## Report interval >0 акумулює рух під BLE HID-чергу (дефолт 0 = sharp лише для USB → рваний курсор по BT). 12мс ≈ як у Charybdis.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

## IMPORTANT: choose ONLY ONE pet widget to avoid linker "multiple definition"
## Disable Bongo Cat widgets (leave Luna enabled by default)
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n

## WPM (central screen)
CONFIG_ZMK_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM=y

## Замість цифр WPM — графік
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE_MAX=100

## Luna (опційно лишаємо)
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=300
