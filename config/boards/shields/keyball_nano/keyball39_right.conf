## ZMK Studio (логічно тримати на central)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=5

## Trackball (тільки там де є сенсор)
CONFIG_SPI=y
CONFIG_PMW3610_ALT=y

## Central-only split features (тільки на central)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

## WPM + Luna (central screen)
CONFIG_ZMK_WPM=y
# WPM widget on
CONFIG_NICE_OLED_WIDGET_WPM=y

# прибираємо цифри
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n

# вмикаємо графік
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE_MAX=100

# Luna лишаємо
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=300

## Явно вимикаємо Bongo, щоб не словити multiple-definition
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n
