## РОБИМО ПРАВУ СТОРОНУ ГОЛОВНОЮ (ОБОВ'ЯЗКОВО)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

## ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=5

## Trackball
CONFIG_SPI=y
CONFIG_PMW3610_ALT=y

## Central-only split features
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

## WPM + Luna
CONFIG_ZMK_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE_MAX=100
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=300

## --- ГРАФІКА ДЛЯ ПРАВОЇ СТОРОНИ ---
CONFIG_NICE_OLED_WIDGET_BATTERY=y
CONFIG_NICE_OLED_WIDGET_BATTERY_IMAGE=y
CONFIG_NICE_OLED_WIDGET_BATTERY_PERCENTAGE=n
CONFIG_NICE_OLED_WIDGET_BATTERY_LABEL=n

CONFIG_NICE_OLED_WIDGET_OUTPUT=y
CONFIG_NICE_OLED_WIDGET_OUTPUT_IMAGE=y
CONFIG_NICE_OLED_WIDGET_OUTPUT_TEXT=n
CONFIG_NICE_OLED_WIDGET_OUTPUT_LABEL=n
CONFIG_NICE_OLED_WIDGET_OUTPUT_BACKGROUND=n

# Координати
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=45
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=49
