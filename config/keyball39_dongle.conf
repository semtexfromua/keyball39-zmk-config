## Config for the DONGLE keyboard variant (separate keyboard-name → separate
## keymap/conf from the bt build). Headless: no nice!view on this variant.

## Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

## Power
CONFIG_ZMK_SLEEP=n
CONFIG_PM_DEVICE=y

## Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

## Pointing / input
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

## Queue
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

## No display on the dongle build (halves run headless here for simplicity)
CONFIG_ZMK_DISPLAY=n
