# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Bluetooth split: right half is the central.
  - board: nice_nano_v2
    shield: keyball39_left nice_view_adapter nice_view_elemental
    format: bluetooth
    artifact-name: keyball39_bluetooth_left
  - board: nice_nano_v2
    shield: keyball39_right nice_view_adapter nice_view_elemental
    snippet: studio-rpc-usb-uart
    format: bluetooth
    artifact-name: keyball39_bluetooth_right

  # Both keyboard halves are BLE peripherals; the receiver is USB central.
  - board: nice_nano_v2
    shield: kball39_dongle_left nice_view_adapter nice_view_elemental
    format: dongle
    artifact-name: keyball39_dongle_left
  - board: nice_nano_v2
    shield: kball39_dongle_right nice_view_adapter nice_view_elemental
    format: dongle
    artifact-name: keyball39_dongle_right
  - board: nice_nano_v2
    shield: kball39_dongle
    snippet: studio-rpc-usb-uart
    format: dongle
    artifact-name: keyball39_dongle_receiver

  # Firmware reset.
  - board: nice_nano_v2
    shield: settings_reset
    format: reset
    artifact-name: settings_reset_nice_nano_v2
