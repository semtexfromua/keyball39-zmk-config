# This file generates the GitHub Actions matrix
---
include:
  # ── BT (поточний робочий режим, без донгла) ──
  - board: nice_nano_v2
    shield: keyball39_left nice_view_adapter nice_view_press_start
  - board: nice_nano_v2
    shield: keyball39_right nice_view_adapter nice_view_press_start
    snippet: studio-rpc-usb-uart

  # ── Dongle (приймач = central по USB; обидві половини = peripheral) ──
  - board: nice_nano_v2
    shield: keyball39_pl nice_view_adapter nice_view_press_start
  - board: nice_nano_v2
    shield: keyball39_pr nice_view_adapter nice_view_press_start
  - board: nice_nano_v2
    shield: keyball39_dongle
    snippet: studio-rpc-usb-uart

  - board: nice_nano_v2
    shield: settings_reset
