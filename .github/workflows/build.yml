name: Build ZMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 */2 *"

jobs:
  bluetooth:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      build_matrix_path: build.yaml
      archive_name: firmware-keyball39-bluetooth

  dongle:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      build_matrix_path: build-dongle.yaml
      archive_name: firmware-keyball39-dongle

  reset:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      build_matrix_path: build-reset.yaml
      archive_name: firmware-reset-nice-nano-v2
