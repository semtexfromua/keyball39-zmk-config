name: Reusable Keyball39 build

on:
  workflow_call:
    inputs:
      build_matrix_path:
        default: build.yaml
        required: false
        type: string
      config_path:
        default: config
        required: false
        type: string

jobs:
  matrix:
    runs-on: ubuntu-22.04
    name: Fetch Build Keyboards
    outputs:
      build_matrix: ${{ env.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Build Matrix
        run: |
          echo "build_matrix=$(yq -oj -I0 '${{ inputs.build_matrix_path }}')" >> "$GITHUB_ENV"
          yq -oj "${{ inputs.build_matrix_path }}"

  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    needs: matrix
    name: Build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: echo "build_dir=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Prepare variables
        shell: sh -x {0}
        env:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
          format: ${{ matrix.format }}
          artifact_name: ${{ matrix.artifact-name }}
          snippet: ${{ matrix.snippet }}
        run: |
          if [ -n "${snippet}" ]; then
            extra_west_args="-S \"${snippet}\""
          fi

          {
            echo "zephyr_version=${ZEPHYR_VERSION}"
            echo "extra_west_args=${extra_west_args}"
            echo "extra_cmake_args=${shield:+-DSHIELD=\"$shield\"}"
            echo "display_name=${shield:+$shield - }${board}"
            echo "format=${format}"
            echo "artifact_name=${artifact_name:-${shield:+$shield-}${board}-zmk}"
          } >> "$GITHUB_ENV"

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-zephyr-${{ env.zephyr_version }}-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('**/west.yml', '**/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        run: west init -l "${{ inputs.config_path }}"

      - name: West Update
        run: west update --fetch-opt=--filter=tree:0

      - name: West Zephyr export
        run: west zephyr-export

      - name: West Build (${{ env.display_name }})
        shell: sh -x {0}
        run: >-
          west build -s zmk/app -d "${{ env.build_dir }}" -b "${{ matrix.board }}"
          ${{ env.extra_west_args }} --
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/${{ inputs.config_path }}"
          ${{ env.extra_cmake_args }}
          ${{ matrix.cmake-args }}

      - name: ${{ env.display_name }} Kconfig file
        if: ${{ !cancelled() }}
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/.config" ]; then
            grep -v -e "^#" -e "^$" "${{ env.build_dir }}/zephyr/.config" | sort
          else
            echo "No Kconfig output"
          fi

      - name: ${{ env.display_name }} Devicetree file
        if: ${{ !cancelled() }}
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/zephyr.dts" ]; then
            cat "${{ env.build_dir }}/zephyr/zephyr.dts"
          elif [ -f "${{ env.build_dir }}/zephyr/zephyr.dts.pre" ]; then
            cat -s "${{ env.build_dir }}/zephyr/zephyr.dts.pre"
          else
            echo "No Devicetree output"
          fi

      - name: Prepare artifact
        run: |
          mkdir "${{ env.build_dir }}/artifacts"
          cp "${{ env.build_dir }}/zephyr/zmk.uf2" \
            "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.uf2"

      - name: Upload (${{ env.display_name }})
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ env.format }}-${{ env.artifact_name }}
          path: ${{ env.build_dir }}/artifacts

  package:
    runs-on: ubuntu-latest
    needs: build
    name: Package firmware choices
    steps:
      - name: Package Bluetooth firmware
        uses: actions/upload-artifact/merge@v4
        with:
          name: firmware-keyball39-bluetooth
          pattern: artifact-bluetooth-*
          delete-merged: true

      - name: Package Dongle firmware
        uses: actions/upload-artifact/merge@v4
        with:
          name: firmware-keyball39-dongle
          pattern: artifact-dongle-*
          delete-merged: true

      - name: Package settings reset
        uses: actions/upload-artifact/merge@v4
        with:
          name: firmware-reset-nice-nano-v2
          pattern: artifact-reset-*
          delete-merged: true
